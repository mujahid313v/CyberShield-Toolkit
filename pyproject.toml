[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybershield-toolkit"
version = "0.1.0"
description = "Beginner-friendly defensive cybersecurity toolkit in Python (CLI)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "mujahid313v"}]
dependencies = [
    "typer[all]>=0.9.0",
    "bcrypt>=4.0.0",
    "pyotp>=2.9.0",
    "requests>=2.31.0",
    "tldextract>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.scripts]
cybershield = "cybershield.cli:app"

[tool.setuptools.packages.find]
include = ["cybershield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=cybershield --cov-report=term-missing --cov-report=xml"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
target-version = ["py311"]
line-length = 88
